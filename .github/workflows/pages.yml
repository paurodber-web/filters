name: Actualizar catálogo y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar todo el catálogo
        run: python outputs/download_catalog.py --refresh
      - name: Comprobar descarga completa
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('outputs/catalog.status.json').read_text())
          assert status.get('complete') is True, status
          assert status['records'] == status['declared_total'] == status['unique_card_ids'], status
          PY
      - name: Construir página
        run: |
          python outputs/rebuild.py
          mkdir -p site
          cp index.html site/index.html
      - name: Guardar HTML actualizado
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-html
          path: site/index.html
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
